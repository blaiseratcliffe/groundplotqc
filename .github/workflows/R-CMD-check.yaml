# R CMD check on eight jobs (plan 19.4; D5.9, D8.22, D11.2, D11.8, D12.58).
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: "windows (release)", os: windows-latest, r: release}
          - {name: "macos (release)", os: macos-latest, r: release}
          - {name: "ubuntu (release)", os: ubuntu-latest, r: release}
          - {name: "ubuntu (devel)", os: ubuntu-latest, r: devel, http-user-agent: release}
          - {name: "ubuntu (oldrel-1)", os: ubuntu-latest, r: oldrel-1}
          - {name: "ubuntu (4.5.0)", os: ubuntu-latest, r: "4.5.0"}
          - {name: "ubuntu (release, NOT_CRAN=false)", os: ubuntu-latest, r: release, not-cran: "false"}
          - {name: "ubuntu (release, data.table 1.18.2.1)", os: ubuntu-latest, r: release, data-table: "1.18.2.1"}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # One job installs DESCRIPTION's data.table floor, the oldest version whose fread()
      # warnings the CSV reader is checked against; the others take the current release
      # (D12.58).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.data-table && format('data.table@{0}', matrix.config.data-table) || '' }}
          needs: check

      - name: Check data.table is the pinned version
        if: matrix.config.data-table
        run: |
          installed <- format(packageVersion("data.table"))
          cat("data.table", installed, "\n")
          if (installed != "${{ matrix.config.data-table }}") {
            stop("data.table is ", installed, ", not the pinned ${{ matrix.config.data-table }}.")
          }
        shell: Rscript {0}

      # setup-r sets NOT_CRAN=true for later steps; this job runs the tests as
      # CRAN would, so CRAN skips are exercised (D11.2, D11.8).
      - name: Set NOT_CRAN=false
        if: matrix.config.not-cran == 'false'
        run: echo "NOT_CRAN=false" >> "$GITHUB_ENV"
        shell: bash

      - name: Show NOT_CRAN
        run: cat("NOT_CRAN =", Sys.getenv("NOT_CRAN"), "\n")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true
