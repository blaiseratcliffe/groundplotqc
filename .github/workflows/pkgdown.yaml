# Builds the pkgdown site on pull requests and deploys it to gh-pages on pushes
# to main (plan 19.4; D5.10, D11.1, D11.7).
name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.

      # pkgdown publishes every root .md file it doesn't know, with no setting
      # to stop it; the project's working files stay off the site. Only this
      # runner's checkout changes (D11.17).
      - name: Leave the project's working files out of the site
        run: rm CLAUDE.md FILEMAP.md NAMING.md
        shell: bash

      - name: Build the site
        if: github.event_name == 'pull_request'
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Build the site and deploy it to gh-pages
        if: github.event_name == 'push'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE, install = FALSE)'
        shell: bash
