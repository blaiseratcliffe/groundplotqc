# R CMD check on seven jobs (plan 19.4; D5.9, D8.22, D11.2, D11.8).
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: "windows (release)", os: windows-latest, r: release}
          - {name: "macos (release)", os: macos-latest, r: release}
          - {name: "ubuntu (release)", os: ubuntu-latest, r: release}
          - {name: "ubuntu (devel)", os: ubuntu-latest, r: devel, http-user-agent: release}
          - {name: "ubuntu (oldrel-1)", os: ubuntu-latest, r: oldrel-1}
          - {name: "ubuntu (4.5.0)", os: ubuntu-latest, r: "4.5.0"}
          - {name: "ubuntu (release, NOT_CRAN=false)", os: ubuntu-latest, r: release, not-cran: "false"}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # setup-r sets NOT_CRAN=true for later steps; this job runs the tests as
      # CRAN would, so CRAN skips are exercised (D11.2, D11.8).
      - name: Set NOT_CRAN=false
        if: matrix.config.not-cran == 'false'
        run: echo "NOT_CRAN=false" >> "$GITHUB_ENV"
        shell: bash

      - name: Show NOT_CRAN
        run: cat("NOT_CRAN =", Sys.getenv("NOT_CRAN"), "\n")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true
